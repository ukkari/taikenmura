<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>QR読み取りテスト</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>

  <style>

    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      font-size: 24px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      background: #078080;
      color: white;
      margin-top: 15px;
    }

    #reader {
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #e6f4ea;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      word-break: break-all;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>📷 QR読み取りテスト</h1>

  <div class="box">

    <p>
      「カメラを起動」を押して、QRコードを読み取ってください。
    </p>

    <button onclick="startScanner()">
      📷 カメラを起動
    </button>

    <div id="reader"></div>

    <div id="result">
      読み取り結果：まだありません
    </div>

  </div>

</div>


<script>

let scanner = null;

function startScanner() {

  if (scanner) {
    return;
  }

  scanner = new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,
      qrbox: 250
    },

    function(decodedText) {

      document.getElementById("result")
        .textContent =
        "読み取り結果：" + decodedText;

      // 一度読み取ったら停止
      scanner.stop();

      scanner = null;

    },

    function(errorMessage) {
      // 読み取り失敗は無視
    }

  ).catch(function(error) {

    document.getElementById("result")
      .textContent =
      "カメラを起動できませんでした：" + error;

  });

}

</script>

</body>

</html>
