<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1">

  <title>備品移動</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>

  <style>

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      margin: 0;
      padding: 20px;

      background: #f5f5f5;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .place {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      margin-top: 10px;
      cursor: pointer;
    }

    .scan {
      background: #4285f4;
      color: white;
    }

    .register {
      background: #34a853;
      color: white;
    }

    .input-area {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 18px;
      margin-top: 8px;
    }

    #reader {
      margin-top: 15px;
    }

    .item {
      background: white;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
    }

    .success {
      background: #e6f4ea;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .error {
      background: #fce8e6;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>📦 備品の場所を変更</h1>

  <div class="place">
    <strong>移動先</strong>

    <div id="place">
      （読み込み中）
    </div>
  </div>


  <button class="scan"
          onclick="startScanner()">
    📷 備品QRを読み取る
  </button>


  <div id="reader"></div>


  <div class="input-area">

    <strong>QRが読めない場合</strong>

    <input id="manualId"
           placeholder="備品IDを入力">

    <button onclick="addManual()">
      IDを追加
    </button>

  </div>


  <h2>
    読み取り済み：
    <span id="count">0</span>件
  </h2>


  <div id="items"></div>


  <button class="register"
          onclick="registerItems()">

    この備品をまとめて移動

  </button>


  <div id="message"></div>

</div>


<script>

// ここにGASのWebアプリURLが入っています
const GAS_URL = "https://script.google.com/macros/s/AKfycbxRTpiIEPVTbuNessqfCCqWsvCJ7SX2crsqq5NTJdoWWPuC5_LeJnyeXQoHY23-l5KT/exec";

// URLの ?dest=倉庫A のような部分から移動先を取得
const params = new URLSearchParams(window.location.search);
const place = params.get('dest') || '';

document.getElementById('place').textContent =
  place || '（移動先が指定されていません。URLに ?dest=場所名 を付けてください）';


let itemIds = [];
let scanner = null;


// QR読み取り開始
function startScanner() {

  if (scanner) {
    return;
  }

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: 250
    },

    (decodedText) => {

      addItem(decodedText);

    },

    () => {
      // 読み取り失敗は無視
    }

  ).catch(err => {

    showError(
      "カメラを起動できませんでした。"
    );

  });

}


// 備品QRから読み取った文字列からIDだけ取り出す
function extractId(text) {

  text = text.trim();

  // URL形式（https://script.google.com/...?id=EQ001）ならidパラメータを取り出す
  try {

    const url = new URL(text);
    const id = url.searchParams.get('id');

    if (id) {
      return id;
    }

  } catch (e) {
    // URLじゃない場合は素のIDとしてそのまま使う
  }

  return text;

}


// 備品を追加
function addItem(rawText) {

  const id = extractId(rawText);

  if (!id) {
    return;
  }

  // 二重登録防止
  if (itemIds.includes(id)) {
    return;
  }

  itemIds.push(id);

  updateList();

}


// 手入力
function addManual() {

  const input =
    document.getElementById("manualId");

  const id = input.value.trim();

  if (!id) {
    return;
  }

  addItem(id);

  input.value = "";

}


// 一覧表示
function updateList() {

  const container =
    document.getElementById("items");

  container.innerHTML = "";

  itemIds.forEach(id => {

    const div =
      document.createElement("div");

    div.className = "item";

    div.textContent = "📦 " + id;

    container.appendChild(div);

  });

  document.getElementById("count")
    .textContent = itemIds.length;

}


// 登録（GASにfetchで送信）
function registerItems() {

  if (!place) {

    showError(
      "移動先が設定されていません。URLに ?dest=場所名 を付けてアクセスしてください。"
    );

    return;
  }

  if (itemIds.length === 0) {

    showError(
      "備品を1つ以上読み取ってください。"
    );

    return;
  }

  const url =
    GAS_URL +
    "?action=moveItems" +
    "&place=" + encodeURIComponent(place) +
    "&ids=" + encodeURIComponent(JSON.stringify(itemIds));

  fetch(url)

    .then(res => res.json())

    .then(data => {

      let html =
        "<div class='success'>" +
        "✅ " +
        data.results.length +
        "件を " +
        place +
        " に移動しました。" +
        "</div>";

      document.getElementById("message")
        .innerHTML = html;

      itemIds = [];

      updateList();

    })

    .catch(err => {

      showError("送信に失敗しました：" + err);

    });

}


function showError(message) {

  document.getElementById("message")
    .innerHTML =
      "<div class='error'>" +
      "⚠️ " +
      message +
      "</div>";

}

</script>

</body>
</html>
